version: '3.4'

# Neo Matrix 单机部署（默认 SQLite，最简上手）
# 生产高可用：取消下面 db/redis 服务的注释，并设置 SQL_DSN/REDIS_CONN_STRING
services:
  neo-matrix:
    build: .            # 构建本 fork 镜像（含供给方/结算功能）
    image: neo-matrix:local
    container_name: neo-matrix
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data          # 持久化 SQLite + 配置
      - ./logs:/app/logs
    environment:
      - SESSION_SECRET=change_me_to_random_string  # 必须修改！openssl rand -hex 32
      - TZ=Asia/Shanghai
      # 离线/内网部署：预下载 tiktoken 词表后挂载
      # - TIKTOKEN_CACHE_DIR=/data/tiktoken-cache
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ---- 生产多机方案（可选，取消注释并设置环境变量）----
    # environment:
    #   - SQL_DSN=neo-matrix:123456@tcp(db:3306)/neo-matrix
    #   - REDIS_CONN_STRING=redis://redis
    # depends_on:
    #   - redis
    #   - db

